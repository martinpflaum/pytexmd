[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytexmd"
version = "1.1"
description = "Translate LaTeX documents to Markdown/MyST and HTML, with CLI and Sphinx integration."
authors = [
    { name = "Martin Pflaum", email = "contact@martinpflaum.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "sphinx>=8.2,<10",
    "myst-parser>=4.0,<6",
    "sphinx-proof>=0.4,<0.5",
    "furo>=2024.8.6",
    "regex>=2024.7.24",
    "sphinxcontrib-tikz>=0.4.20,<0.5",
    "sphinxcontrib-bibtex>=2.6,<3"
]
[project.urls]
Homepage = "https://github.com/yourusername/pytexmd"
Repository = "https://github.com/yourusername/pytexmd"

[project.scripts]
pytexmd = "pytexmd.cli:main"
pytexmd-html = "app.PytexmdConverter.cli:main"
pytexmd-gui = "app.PytexmdConverter.gui:main"
pytexmd-editor = "app.PytexmdEditor.editor:main"

[tool.setuptools.packages.find]
include = ["pytexmd*", "app*"]

[tool.setuptools.package-data]
pytexmd = ["templates/*.txt"]
"app.PytexmdEditor" = ["editor_assets/*"]
